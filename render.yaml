services:
  - type: web
    name: azure-ai-suite
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NITRO_PRESET
        value: node-server
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_HOST
        value: 0.0.0.0
